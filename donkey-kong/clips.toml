# Donkey Kong: Original Edition's kept clip set (docs/formats/clips.md):
# donkey-kong-ju's 25m clips, made on this ROM. The two games run from
# power-on to 25m on the same frames (the title and a game's start take
# the same frames, measured 2026-11-03), so each clip's start is
# donkey-kong-ju's presses from power-on (a copy of that template's clips/
# files, since a set reads only its own folder), and its curve is this
# ROM's. The random bytes $18-$1F differ, so
# the barrels' and the fires' choices part from donkey-kong-ju's once read;
# the mapping scores with the original's draws. No snapshot and no game
# data.
[clipset]
format = "0.5.0"
game = "donkey-kong-oe"
rom = "45440d8ef512b4660dce0c753e110004aef96fa30f2967f9260e946d808db07d"
mapping = "22"
run = "dkoe-gate"

