# This game's bench (gameprinter's `gp bench clips donkey-kong` and `gp
# bench scratch donkey-kong`, its docs/benchmarks.md), read from here by
# the bench runner. Paths are under the games checkout ($GP_GAMES_DIR, else
# ../games beside the gameprinter repo). The answer key is the package's
# own hand-written model and state mapping; the game has no source, so the
# rows game-printer graded against Moss Hop's source say they need one.
# Nothing here is ROM data.

[bench]
template = "donkey-kong"
seeds = [1, 2]
dense_budget = 400
dense_keep = 15

[wrong_model]
says = "the barrel's hitbox one pixel taller"
set = { "entities.barrel.hitbox.h" = 5 }

[grade]
model = "donkey-kong"

[scratch]
rounds = 2
# Stage 0: the static harvest from the ROM alone, its facts in its own
# names (no answer key is read).
static_command = ["model", "static", "{rom}", "--model", "{model}"]
recordings = 4

# The blind farming bench (gameprinter's `gp farm bench`, its
# bench/farm-blind.toml) plays this game's source blind: no package,
# mapping or dataset, its ROM found in $GP_ROM_DIR by roms.toml's sha256.
# On 2026-11-12 none of stage 0's start runs reached play on it, so its
# pass ends at "play start" (as in game-printer).
[farm_blind]
source = "donkey-kong-ju"
set = "train"
