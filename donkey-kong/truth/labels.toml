# Donkey Kong: Original Edition's RAM and routines, named for scoring the
# gaps detectors (truth/gaps.toml). Our own names and words, taken from what
# the model, the state mapping and the hooks already say about the code
# (model.toml's evidence notes, mapping.toml's field notes, ext/src); no
# bytes of the game. Addresses are the CPU's; the 32 KB program is one bank
# at $8000, so prg is the address less $8000.
#
# Pass it with --labels: `gp gaps all donkey-kong --labels
# donkey-kong/truth/labels.toml --truth donkey-kong/truth/gaps.toml`. It is
# not the package's labels.toml, so other gaps runs name things as before.
#
# A size marked "unsure" is worked out, not read off one store.
schema = 0
game = "donkey-kong-oe"
bank_size = 32768

