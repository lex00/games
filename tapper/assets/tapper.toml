# Arcade asset map for Tapper (gp_assets::arcade in gameprinter): its
# pictures by graphics region and index, the same in every set listed,
# lifted from whichever of them the player has. Colours come from the
# board's palette RAM as the game runs, not from here.
schema = 1
platform = "arcade"
source = "tapper"
title = "Tapper"
board = "mcr_91490"
sets = ["rbtapper", "tapper", "tappera", "tapperg", "sutapper"]

# gfx1: 1024 background tiles of 8 by 8, drawn doubled as 16 by 16.
[[asset]]
name = "tiles"
format = "mcr-tiles"
region = "gfx1"
first = 0
count = 1024
per_row = 32

# gfx2: 256 sprites of 32 by 32.
[[asset]]
name = "sprites"
format = "mcr-sprites"
region = "gfx2"
first = 0
count = 256
per_row = 16

# The program's data tables the hooks read (gp_assets::arcade byte-rows),
# by CPU address in maincpu, found with gp code listing and gp code tables
# on tapper.l8.001; `at` gives a table's place in a set whose program keeps
# it elsewhere (found the same way on that set).

# Each customer slot's first object, 16 slots of 8 bytes (y, flags,
# picture, x, then its mug's), copied in by the slot's arrival ($15FF on).
[[asset]]
name = "customer_starts"
format = "byte-rows"
region = "maincpu"
offset = 0xC421
count = 16
width = 8

[asset.at]
tappera = 0xC411
rbtapper = 0xC5A1

# Each bar's ends, 4 bytes a bar from the bottom: the left end at +1, the
# right at +2 (read by $0742 at $0774 and $0890 at $08AB).
[[asset]]
name = "bar_ends"
format = "byte-rows"
region = "maincpu"
offset = 0x0977
count = 4
width = 4

# Each customer slot's arrival routine, a word a slot ($0987, read at $093C
# and $4C34): a timer naming one of them brings that slot's customer.
[[asset]]
name = "arrivals"
format = "byte-rows"
region = "maincpu"
offset = 0x0987
count = 16
width = 2

# The customer slots that arrive at a level's start: a word a level
# (levels cleared, up to 9) pointing into the lists below ($4C19).
[[asset]]
name = "start_list_ptrs"
format = "byte-rows"
region = "maincpu"
offset = 0x4CE5
count = 10
width = 2

[asset.at]
rbtapper = 0x4E75

# The lists: slot numbers, each list ended by $FF ($4C2D).
[[asset]]
name = "start_lists"
format = "byte-rows"
region = "maincpu"
offset = 0x4C83
count = 98
width = 1

[asset.at]
rbtapper = 0x4E13

# A level's times, 12 bytes a level by E4A9 ($4E50): the respawn wait
# (E3B1), the times to the waits' speed-up ($2023) and two other events
# ($1B02, $2209), and from the sixth level on a second wait and when it
# starts ($1B2E).
[[asset]]
name = "level_times"
format = "byte-rows"
region = "maincpu"
offset = 0x4EAB
count = 9
width = 12

[asset.at]
rbtapper = 0x503B

# The customer slots' records a level starts with, by the bar shown: four
# blocks of 16 records of 32 bytes, copied to E4B2 by the setup ($4A65,
# through the pointers at $4AA0, which point at these blocks in order).
[[asset]]
name = "record_blocks"
format = "byte-rows"
region = "maincpu"
offset = 0xBC21
count = 64
width = 32

[asset.at]
tappera = 0xBC11
rbtapper = 0xBDA1

# The level's end scripts, two lists (by E3ED, drawn at a game's start)
# of ten words by the levels cleared ($5623: $56CA points at them), each a
# 5-byte step that calls the script; five such steps, 5 bytes apart.
[[asset]]
name = "end_script_lists"
format = "byte-rows"
region = "maincpu"
offset = 0x56D0
count = 20
width = 2

[asset.at]
rbtapper = 0x5860

# The four objects the slide copies into the mug slots from E326 when it
# ends ($1F75: ld hl,$2003; ldir 32 bytes), 8 bytes an object (y, flags,
# picture, x, then a second sprite's). The same place in every set listed
# (gp query on recordings of each).
[[asset]]
name = "slide_objects"
format = "byte-rows"
region = "maincpu"
offset = 0x2003
count = 4
width = 8

# The space bar's level end hops ($50EF): the bartender's steps along,
# one signed byte a hop, 10 hops ($5180: ld hl,$519F, indexed by 10 less
# B). rbtapper keeps it at $532F (its loop reads it at $5310); the other
# sets at $519F (gp query on a recording of each).
[[asset]]
name = "hop_steps"
format = "byte-rows"
region = "maincpu"
offset = 0x519F
count = 10
width = 1

[asset.at]
rbtapper = 0x532F
# The show a tip starts ($14E7): the dancers' first picture by the bar
# shown, through the words at $15F5 by E3B8 ($1500 to $1515: ld hl,$15F5,
# then 36 bytes to E23E). The words name four pictures of 36 bytes in a
# row from $155A, the same place in every set listed (gp query on a
# recording of each); the hook takes each word less the first.
[[asset]]
name = "show_first_ptrs"
format = "byte-rows"
region = "maincpu"
offset = 0x15F5
count = 4
width = 2
[[asset]]
name = "show_first"
format = "byte-rows"
region = "maincpu"
offset = 0x155A
count = 144
width = 1
# The show's next pictures ($0C25, every 6 frames): the words at $0C99 by
# E3B8 ($0C38 to $0C46) each name a list of eight words, by E710, naming
# 36 bytes to copy to E23E ($0C5C to $0C68). The lists and the pictures
# follow from the first word's place, 856 bytes; rbtapper keeps the words
# at $0C94 (its $0C25 reads them at $0C38), and the lists from $0C9E.
[[asset]]
name = "show_lists"
format = "byte-rows"
region = "maincpu"
offset = 0x0C99
count = 4
width = 2
[asset.at]
rbtapper = 0x0C94
[[asset]]
name = "show_pictures"
format = "byte-rows"
region = "maincpu"
offset = 0x0CA3
count = 856
width = 1
[asset.at]
rbtapper = 0x0C9E
