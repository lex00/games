# Arcade asset map for Tapper (gp_assets::arcade in gameprinter): its
# pictures by graphics region and index, the same in every set listed,
# lifted from whichever of them the player has. Colours come from the
# board's palette RAM as the game runs, not from here.
schema = 1
platform = "arcade"
source = "tapper"
title = "Tapper"
board = "mcr_91490"
sets = ["rbtapper", "tapper", "tappera", "tapperg", "sutapper"]

# gfx1: 1024 background tiles of 8 by 8, drawn doubled as 16 by 16.
[[asset]]
name = "tiles"
format = "mcr-tiles"
region = "gfx1"
first = 0
count = 1024
per_row = 32

# gfx2: 256 sprites of 32 by 32.
[[asset]]
name = "sprites"
format = "mcr-sprites"
region = "gfx2"
first = 0
count = 256
per_row = 16

# The program's data tables the hooks read (gp_assets::arcade byte-rows),
# by CPU address in maincpu, found with gp code listing and gp code tables
# on tapper.l8.001; `at` gives a table's place in a set whose program keeps
# it elsewhere (found the same way on that set).

# Each customer slot's first object, 16 slots of 8 bytes (y, flags,
# picture, x, then its mug's), copied in by the slot's arrival ($15FF on).
[[asset]]
name = "customer_starts"
format = "byte-rows"
region = "maincpu"
offset = 0xC421
count = 16
width = 8

[asset.at]
tappera = 0xC411
rbtapper = 0xC5A1

# Each bar's ends, 4 bytes a bar from the bottom: the left end at +1, the
# right at +2 (read by $0742 at $0774 and $0890 at $08AB).
[[asset]]
name = "bar_ends"
format = "byte-rows"
region = "maincpu"
offset = 0x0977
count = 4
width = 4

# Each customer slot's arrival routine, a word a slot ($0987, read at $093C
# and $4C34): a timer naming one of them brings that slot's customer.
[[asset]]
name = "arrivals"
format = "byte-rows"
region = "maincpu"
offset = 0x0987
count = 16
width = 2

# The customer slots that arrive at a level's start: a word a level
# (levels cleared, up to 9) pointing into the lists below ($4C19).
[[asset]]
name = "start_list_ptrs"
format = "byte-rows"
region = "maincpu"
offset = 0x4CE5
count = 10
width = 2

[asset.at]
rbtapper = 0x4E75

# The lists: slot numbers, each list ended by $FF ($4C2D).
[[asset]]
name = "start_lists"
format = "byte-rows"
region = "maincpu"
offset = 0x4C83
count = 98
width = 1

[asset.at]
rbtapper = 0x4E13

# A level's times, 12 bytes a level by E4A9 ($4E50): the respawn wait
# (E3B1), the times to the waits' speed-up ($2023) and two other events
# ($1B02, $2209), and from the sixth level on a second wait and when it
# starts ($1B2E).
[[asset]]
name = "level_times"
format = "byte-rows"
region = "maincpu"
offset = 0x4EAB
count = 9
width = 12

[asset.at]
rbtapper = 0x503B

# The customer slots' records a level starts with, by the bar shown: four
# blocks of 16 records of 32 bytes, copied to E4B2 by the setup ($4A65,
# through the pointers at $4AA0, which point at these blocks in order).
[[asset]]
name = "record_blocks"
format = "byte-rows"
region = "maincpu"
offset = 0xBC21
count = 64
width = 32

[asset.at]
tappera = 0xBC11
rbtapper = 0xBDA1

# The level's end scripts, two lists (by E3ED, drawn at a game's start)
# of ten words by the levels cleared ($5623: $56CA points at them), each a
# 5-byte step that calls the script; five such steps, 5 bytes apart.
[[asset]]
name = "end_script_lists"
format = "byte-rows"
region = "maincpu"
offset = 0x56D0
count = 20
width = 2

[asset.at]
rbtapper = 0x5860

# The four objects the slide copies into the mug slots from E326 when it
# ends ($1F75: ld hl,$2003; ldir 32 bytes), 8 bytes an object (y, flags,
# picture, x, then a second sprite's). The same place in every set listed
# (gp query on recordings of each).
[[asset]]
name = "slide_objects"
format = "byte-rows"
region = "maincpu"
offset = 0x2003
count = 4
width = 8

# The space bar's level end hops ($50EF): the bartender's steps along,
# one signed byte a hop, 10 hops ($5180: ld hl,$519F, indexed by 10 less
# B). rbtapper keeps it at $532F (its loop reads it at $5310); the other
# sets at $519F (gp query on a recording of each).
[[asset]]
name = "hop_steps"
format = "byte-rows"
region = "maincpu"
offset = 0x519F
count = 10
width = 1

[asset.at]
rbtapper = 0x532F
# The show a tip starts ($14E7): the dancers' first picture by the bar
# shown, through the words at $15F5 by E3B8 ($1500 to $1515: ld hl,$15F5,
# then 36 bytes to E23E). The words name four pictures of 36 bytes in a
# row from $155A, the same place in every set listed (gp query on a
# recording of each); the hook takes each word less the first.
[[asset]]
name = "show_first_ptrs"
format = "byte-rows"
region = "maincpu"
offset = 0x15F5
count = 4
width = 2
[[asset]]
name = "show_first"
format = "byte-rows"
region = "maincpu"
offset = 0x155A
count = 144
width = 1
# The show's next pictures ($0C25, every 6 frames): the words at $0C99 by
# E3B8 ($0C38 to $0C46) each name a list of eight words, by E710, naming
# 36 bytes to copy to E23E ($0C5C to $0C68). The lists and the pictures
# follow from the first word's place, 856 bytes; rbtapper keeps the words
# at $0C94 (its $0C25 reads them at $0C38), and the lists from $0C9E.
[[asset]]
name = "show_lists"
format = "byte-rows"
region = "maincpu"
offset = 0x0C99
count = 4
width = 2
[asset.at]
rbtapper = 0x0C94
[[asset]]
name = "show_pictures"
format = "byte-rows"
region = "maincpu"
offset = 0x0CA3
count = 856
width = 1
[asset.at]
rbtapper = 0x0C9E
# The code that asks the sound board for sounds (the sound hook, ext/src/
# sound.rs): each a stretch of the program from an `ld c,N` the code asks
# with ($606B takes C), so the request bytes are the player's romset's.
# Found with gp code listing and gp-arcade's write log on tapper-first (the
# queue at E0E1 and the calls that fill it); each set's place by its code
# around them (rbtapper's $606B is at $61EB, so its calls differ there).
#
# $0387 and $038C: a coin counted asks for 2 and 9 ($0379, the frame's
# send).
[[asset]]
name = "sound_coin"
format = "byte-rows"
region = "maincpu"
offset = 0x0387
count = 7
width = 1
[asset.at]
sutapper = 0x0393
# $00B9 to $00C6: the boot's last requests, 2, 2 and 3 (the second 2 is
# C left from the first).
[[asset]]
name = "sound_boot"
format = "byte-rows"
region = "maincpu"
offset = 0x00B9
count = 13
width = 1
# $CFC5 to $D06D: the boot's sound check, 2, then 2 and 1, and the four
# bytes at $D06A it writes to all four latches.
[[asset]]
name = "sound_check"
format = "byte-rows"
region = "maincpu"
offset = 0xCFC5
count = 169
width = 1
[asset.at]
rbtapper = 0xD145
tappera = 0xCFB5
# $4B34 to $4C74: a game's start (2 and 2A at $4B34 and $4B39) and a
# level's setup (2 at $4B9A and $4C4E, then the bar shown's byte of the
# table at $4C71, $4C56).
[[asset]]
name = "sound_game"
format = "byte-rows"
region = "maincpu"
offset = 0x4B34
count = 321
width = 1
[asset.at]
rbtapper = 0x4CC4
# $125E to $14DC: the pour ($30 and $3A when the mug is full, $39 and $38
# for the stream, $125E to $12E2) and the mug sent ($12 at $14DB).
[[asset]]
name = "sound_bar"
format = "byte-rows"
region = "maincpu"
offset = 0x125E
count = 639
width = 1
[asset.at]
rbtapper = 0x1259
# $090D to $0A9F: a customer served at the bar's far end ($1E at $090D),
# and the bartender landing at another bar ($0E at $0A97, $0D at $0A9E).
[[asset]]
name = "sound_customers"
format = "byte-rows"
region = "maincpu"
offset = 0x090D
count = 403
width = 1
# $23EA to $2442: a life lost's mug falling ($1A), its crash ($1B at
# $2402) and $2441's 2.
[[asset]]
name = "sound_life"
format = "byte-rows"
region = "maincpu"
offset = 0x23EA
count = 89
width = 1
# $15FF to $18DF: the 16 customer slots' arrival routines (the arrivals
# table's words), each starting `ld c,N` with N the arrival's request.
[[asset]]
name = "sound_arrivals"
format = "byte-rows"
region = "maincpu"
offset = 0x15FF
count = 737
width = 1


# The board's 64 colours as the program loads them into palette RAM at a
# level's setup ($4B58: hl = $616D, call $600F). rbtapper loads it from
# $62ED and tappera from $615D (the same instruction in each set's program).
[[asset]]
name = "palette"
format = "mcr-palette"
region = "maincpu"
offset = 0x616D

[asset.at]
rbtapper = 0x62ED
tappera = 0x615D

# The saloon's screen, the first of the stages the setup's $5DF6 picks by
# the levels cleared from the pointers at $61ED; the vblank's $5D19 copies
# it into video RAM. rbtapper's pointers ($636D) and tappera's name
# $63A1 and $6211 first.
[[asset]]
name = "screen_saloon"
format = "mcr-screen"
region = "maincpu"
offset = 0x6221

[asset.at]
rbtapper = 0x63A1
tappera = 0x6211

# The colours the level's intro pokes over the loaded palette ($540A to
# $5414: two loads of A, each stored into palette RAM, at $F800 and $F840
# from the first and at $F84D from the second): the code's own bytes from
# $540B, the first and the ninth of the row.
[[asset]]
name = "intro_colors"
format = "byte-rows"
region = "maincpu"
offset = 0x540B
count = 1
width = 9

[asset.at]
rbtapper = 0x559B

# Each bar's two colours, which a level's start ($570C) writes into palette
# RAM's $60 and $6C by the bar shown (E3B8): a row a bar.
[[asset]]
name = "bar_colors"
format = "byte-rows"
region = "maincpu"
offset = 0x5751
count = 4
width = 2

[asset.at]
rbtapper = 0x58E1

# The settings a board starts with when its battery-backed RAM fails the
# check at boot ($048A to $0504): $0505 copies these 94 bytes to E000
# ($0511: ld hl,$0526; ldir at $0517) and clears the next 63. Among them
# the coins a credit (E000) and the credits a coin (E001), read by the coin
# routine ($0242 to $0253), the lives (E005, $4B1F) and the level row a
# game starts at (E006, $4B08), which is also the tips setting ($588A).
# The same place in the tapper, rbtapper, tappera and tapperg sets;
# sutapper copies from $0532 ($051A: ld hl,$0532), with the same bytes
# (gp query on a recording of each).
[[asset]]
name = "defaults"
format = "byte-rows"
region = "maincpu"
offset = 0x0526
count = 1
width = 94

[asset.at]
sutapper = 0x0532

# Each level's layout, a byte a level by the levels cleared: bit k set
# puts bar k's tap on its left end. The setup's $2EC3 reads it into E3AF
# ($2ED5: ld hl,$4CF9, by E4A8, which from 26 on counts 13 to 25 again).
# rbtapper keeps it at $4E89 ($2EE9 reads it); the other sets at $4CF9
# (the code found by its bytes in a recording of each).
[[asset]]
name = "layouts"
format = "byte-rows"
region = "maincpu"
offset = 0x4CF9
count = 26
width = 1

[asset.at]
rbtapper = 0x4E89

# The bars' objects the setup's $4D13 copies in, by each bar's side
# (E3AF): a row for taps on the right end ($4DCC) and one for taps on
# the left ($4DFC), each three groups of 16 bytes: the four taps (to
# E346), the four end pieces (to E356) and the four far ends (to E366),
# 4 bytes an object (y, flags, picture, x), a bar's at 4 times its
# number. rbtapper keeps them at $4F5C ($4EB1); the other sets at $4DCC
# (the code found by its bytes in a recording of each).
[[asset]]
name = "bar_objects"
format = "byte-rows"
region = "maincpu"
offset = 0x4DCC
count = 2
width = 48

[asset.at]
rbtapper = 0x4F5C

# The bonus round's pairs of cans to swap ($4F17 and $5003, both from
# $2AD1): five entries of two words in $4F17 (ld hl,$2AD1 at $4F3E, 4
# bytes a pick: the two cans' objects, E262 + 8 a can), the first five
# words in $5003 (at $502A, 2 bytes a pick: a can and the next). rbtapper
# keeps it at $2AE5 ($50CE, $51BA); the other sets at $2AD1 (the code
# found by its bytes in a recording of each).
[[asset]]
name = "bonus_pairs"
format = "byte-rows"
region = "maincpu"
offset = 0x2AD1
count = 10
width = 2

[asset.at]
rbtapper = 0x2AE5

# The other stages: $5DF6 takes a stage's screen from the words at $61ED
# by the levels cleared (E4A8, from 26 on counted 13 to 25 again, as
# $2EC3 counts the layouts) into E395. Each set's own words name its
# screens: rbtapper's at $636D ($5F79), tappera's at $61DD ($5DE9), the
# others' at $61ED (the code found by its bytes in a recording of each).
# The words $5DF6 takes a stage's screen from, by the stage (E395), 26
# of them: the hooks read which screen each stage shows from the player's
