# An arcade original: ram[...] reads the main CPU's addresses (work RAM
# at 0xE000 on Midway MCR).
platform = "arcade"
# The state mapping, written by gp game new: where the game's RAM holds
# each part of the model's state. Nothing is mapped yet. Add the player's
# place first, before the first clip: a clip scored over no fields agrees
# on every frame, and the gate would then hold every clip to it.
schema = 22
model = "tapper"
source = "tapper"
description = "The bartender's place, measured"
align = "polled"

# The game keeps its objects as 4-byte slots at E262-E345 (y, flags, picture,
# x), which the frame's work moves and the video routine copies to the
# sprite RAM; nothing else holds the bartender's place. His slot is E2E6
# (tapper-m3-five, 6,102 frames with him at a bar: no other byte follows
# his x or his y). His bar is E6F9 (0 the bottom bar, 3 the top; up adds
# one), which changes on the frame his y does. y counts up the screen:
# 48 is the bottom bar.

# The random draws (docs/formats/draws.md): every call of the random routine
# $5FAC, which steps the register E390 with the Z80's R register ($5FBD)
# and returns a number below B in A. Each site is the call (`call $5fac`);
# the draw is A when the routine returns. Found with `gp interp draws --find`
# on the corpus's longest clip log (tapper.bonus.006 from power-on, 27,749
# frames: the register E390, 2,184 reads of $5FBD) and `gp model static`'s
# list of the calls of $5FAC. The hooks don't draw yet; the lockstep records
# them for the customers, mugs and tips to come.
score_draws = true

[[draws]]
site = "customer_wait_start"
pc = 0x09DE
ram = 0xE390
note = "A customer's first wait: below 20, plus twice (10 less its kind), into its frames left (+4). gp interp draws --find lists it among the reads stored for later (into E4B6 + 0x20 a customer)"

[[draws]]
site = "pushed_drink"
pc = 0x106D
ram = 0xE390
note = "A customer reached by a mug: below 6, the drink's timer. --find: a read that decides nothing within its window"

[[draws]]
site = "throw_wait"
pc = 0x10C6
ram = 0xE390
note = "A customer done drinking: below 15, plus 5, the frames before the empty mug comes. --find: stored for later"

[[draws]]
site = "tip_show_pick"
pc = 0x1523
ram = 0xE390
note = "A tip picked up starts the show ($0BD8 calls $14E7): eight draws below 2, each picking one of two customer slots ($1526 to $1538) that turns to watch (state 6, $1553). gp model static lists this call of $5FAC; --find didn't reach it in the 27,749-frame cycle, where no tip is picked up; tapper.tip.001 runs it (gp code listing). Named arrival_slot before, for a level's start, which it isn't"

[[draws]]
site = "arrival_wait"
pc = 0x1B6C
ram = 0xE390
note = "A new customer: below 16, plus 16, its first wait. --find: stored for later"

[[draws]]
site = "tip_wait"
pc = 0x213B
ram = 0xE390
note = "A tip left on the bar ($20DE): below 3, plus 4, into E72E, the customers' throws to the next tip"

[[draws]]
site = "bonus_shake"
pc = 0x258A
ram = 0xE390
note = "The bonus round: below 5, which can is shaken. --find proposes it: it indexes the tables at $259D, $25AC and $25B8"

[[draws]]
site = "game_start"
pc = 0x4AFA
ram = 0xE390
note = "A game's start: below 2, into E3ED. --find: stored for later"

[[draws]]
site = "attract_pick"
pc = 0x4F35
ram = 0xE390
note = "Attract mode: below 4, not the last one (E719). --find proposes it"

[[draws]]
site = "attract_pick_2"
pc = 0x5021
ram = 0xE390
note = "Attract mode, the second list: below 4, not the last one (E719). --find proposes it"

[[draws]]
site = "tip_kind"
pc = 0x59F2
ram = 0xE390
note = "Every 16 frames of E3C4: below 3, picks from the table at $5A5C. gp model static lists this call; --find counts its reads under $5FAE, the call inside $5FAC"

# The mugs: 8-byte objects from E2FE (y, flags, picture, x, then a
# second sprite's), free while y is 0. gp track found them on tapper.l8.001
# (6 slots, stride 8, x E301); gp labels propose shows the send ($13CC)
# writing E2FE, E306 and E30E and the mugs' move ($0742) their x. Empty
# mugs and tips use the same slots and aren't modelled yet: they read as
# mugs that don't move.
[slots]
active = 0xE2FE
active_stride = 8
count = 9
note = "The mugs from E2FE, 8 bytes a slot (gp track, gp labels propose, gp element inputs). A slot holds an object while its y isn't 0. The slots hold the play's objects while the bars are set up: the setup's $4D13 writes the bars' far ends from E366 (bar 0's x at E369) with the taps, and $5F31 empties them with every object from E18E (the next setup at $4B4D, the bonus round's and the game over's), after which the slots hold the scripts' pictures (the setup's intro at $5404, the bonus round). So the play's objects stay through a customer's slide ($1CE1, the bartender off his bar), a life lost ($236E) and a level's end until the clear, as the program leaves them (tapper.l6.001, tapper.die.001). The rule before this one read them empty whenever the bartender was off a bar's line"
vacant = "ram[0xE3BD] != 0 || ram[0xE369] == 0"

[[slots.level]]
level = "main"
when = "ram[0xE3BD] == 0"

[[slots.field]]
note = "The mug's x"
path = "x"
ram = [0xE301]
stride = 8

[[slots.field]]
note = "The mug's y: its bar's line less 5 for a full mug (52, 100, 148, 196), less 3 for an empty one or a tip"
path = "y"
ram = [0xE2FE]
stride = 8

[[slots.field]]
note = "Not compared: the fraction of the mug's x, its slot's +6 ($07CF)"
path = "ext[1]"
presentation = true
ram = [0xE304]
stride = 8

[[slots.field]]
index = true
note = "Not compared: the mug's slot, plus 1: the send ($1468) and the throw ($10E2) take the first slot whose y is 0, so a slot emptied and taken on one frame is the same object"
offset = 1
path = "ext[2]"
presentation = true
ram = []

[[slots.field]]
note = "Not compared: the mug's flags (+4): bit 0 an empty mug, bit 3 moving left, its bar in the high nibble ($074F, $0762, $0777); set by the send ($1486 to $14C4) and the throw ($1108 to $1123)"
path = "ext[3]"
presentation = true
ram = [0xE302]
stride = 8

[[slots.kind]]
entity = "mug"
ids = [0]

[[slots.group]]
active = 0xE262
active_stride = 8
count = 16
name = "customers"
note = "The customers: 8-byte objects from E262 (the customer's y, flags, picture, x, then its mug's), 4 a bar from the bottom, each with a 0x20-byte record from E4B2 ($0B43 walks both). A slot holds a customer while its y isn't 0"
vacant = "ram[0xE3BD] != 0 || ram[0xE369] == 0"

[[slots.group.field]]
note = "The customer's x"
path = "x"
ram = [0xE265]
stride = 8

[[slots.group.field]]
note = "The customer's y: its bar's line, 57, 105, 153 or 201"
path = "y"
ram = [0xE262]
stride = 8

[[slots.group.field]]
note = "Not compared: its state (+0) and facing (+0D, 1 on a bar whose tap is on the left)"
path = "ext[0]"
presentation = true
ram = [0xE4B2, 0xE4BF]
stride = 32

[[slots.group.field]]
note = "Not compared: its timer (+4)"
path = "ext[1]"
presentation = true
ram = [0xE4B6]
stride = 32

[[slots.group.field]]
note = "Not compared: its wait (+2) and drink (+9)"
path = "ext[2]"
presentation = true
ram = [0xE4B4, 0xE4BB]
stride = 32

[[slots.group.field]]
note = "Not compared: its drink's turn (+3), the turns left (+5) and its slot (+0C)"
path = "ext[3]"
presentation = true
ram = [0xE4B5, 0xE4B7, 0xE4BE]
stride = 32

[[slots.group.kind]]
entity = "customer"
ids = [0]

[[slots.group]]
active = 0xE25E
active_stride = 8
count = 1
name = "tips"
note = "The tip: the object at E25E (y, flags, picture, x), a tip while its picture E260 is $4D ($0B8C)"
vacant = "ram[0xE260] != 0x4D || ram[0xE3BD] != 0 || ram[0xE369] == 0"

[[slots.group.field]]
note = "The tip's x"
path = "x"
ram = [0xE261]
stride = 8

[[slots.group.field]]
note = "The tip's y: 8 above the customer that left it"
path = "y"
ram = [0xE25E]
stride = 8

[[slots.group.kind]]
entity = "tip"
ids = [0]

[[slots.group]]
active = 0xE41B
active_stride = 6
count = 24
free = 0xFF
name = "timers"
vacant = "ram[0xE3BD] > 0xFF"
note = "The game's timers ($603C sets one, $60C1 counts them each frame): 6 bytes each from E417, the frames left (+0, +1) and the routine (+3, +4). Every entry is carried, used or not ($603C takes the first idle one, so their order matters). Held, not measured"

[[slots.group.field]]
note = "Not compared: the frames left"
path = "ext[0]"
presentation = true
ram = [0xE417, 0xE418]
stride = 6

[[slots.group.field]]
note = "Not compared: the routine it runs"
path = "ext[1]"
presentation = true
ram = [0xE41A, 0xE41B]
stride = 6

[[slots.group.kind]]
entity = "timer"
holds_slot = true
ids = [0]

[[slots.group]]
active = 0xE4BA
active_stride = 32
count = 16
free = 0xFF
name = "records"
vacant = "ram[0xE3BD] > 0xFF"
note = "The customer slots' records, 0x20 bytes each from E4B2, kept while a customer is away. Held, not measured"

[[slots.group.field]]
note = "Not compared: the wait (+2) and the drink (+9)"
path = "ext[0]"
presentation = true
ram = [0xE4B4, 0xE4BB]
stride = 32

[[slots.group.field]]
note = "Not compared: the bar (+8) and the facing (+0D)"
path = "ext[1]"
presentation = true
ram = [0xE4BA, 0xE4BF]
stride = 32

[[slots.group.field]]
note = "Not compared: the slot's number (+0C)"
path = "ext[2]"
presentation = true
ram = [0xE4BE]
stride = 32

[[slots.group.field]]
note = "Not compared: the customer's picture set (+10); $DE stands 3 higher ($1B74) and reaches the bar's ends 4 sooner ($08C3, $08FD)"
path = "ext[3]"
presentation = true
ram = [0xE4C2]
stride = 32

[[slots.group.kind]]
entity = "record"
holds_slot = true
ids = [0]

[[field]]
note = "Not compared: the customers' walk a frame, E3B3 ($117F); the throws to the next tip E72E and the level's tips left E72F ($20DE); the tips setting E006, copied from the program's defaults at boot ($0517)"
path = "entities.bars[0].ext[0]"
presentation = true
ram = [0xE3B3, 0xE72E, 0xE72F, 0xE006]

[[field]]
note = "Not compared: an empty mug's speed, E3B0 ($075C)"
path = "entities.bars[0].ext[1]"
presentation = true
ram = [0xE3B0]

[[field]]
note = "Not compared: the respawn wait E3B1 ($091D), the levels cleared E4A8 and the level's row E4A9 ($4E50), for the arrivals"
path = "entities.bars[0].ext[3]"
presentation = true
ram = [0xE3B1, 0xE3B2, 0xE4A8, 0xE4A9]

[[field]]
note = "Not compared: a full mug's speed, E6FE:E6FD, 8.8 ($07D2)"
path = "entities.bars[0].ext[2]"
presentation = true
ram = [0xE6FD, 0xE6FE]
signed = true

[[field]]
note = "The bartender's x: his slot's x, E2E9. Walking moves it 2 a frame; at a tap he stands at 209, 193, 177 and 161 on bars 0 (the bottom) to 3 of the saloon (tapper-m3-five, frames 1110 to 1190), 6 less once a mug is sent"
path = "entities.player[0].x"
ram = [0xE2E9]
whole = true

[[field.case]]
unmeasured = "Out of a game (E3BD 1 in attract mode, 2 at game over) the slot holds the attract mode's objects"
when = "ram[0xE3BD] != 0"

[[field.case]]
unmeasured = "Between levels, at a level's start and in a life lost, the slot holds no bartender at a bar: his y is no bar's row (48, 96, 144 or 192, give or take the 2 his walk bobs)"
when = "!((ram[0xE2E6] >= 46 && ram[0xE2E6] <= 50) || (ram[0xE2E6] >= 94 && ram[0xE2E6] <= 98) || (ram[0xE2E6] >= 142 && ram[0xE2E6] <= 146) || (ram[0xE2E6] >= 190 && ram[0xE2E6] <= 194))"

[[field]]
note = "The bartender's y: his slot's y, E2E6: 48 times his bar plus 48, counting up the screen (48 the bottom bar, 192 the top), and while he walks it bobs a step every 3 frames, 0, +1, +2, +1 from where the walk started (tapper-diagonal-4way-a, frames 601 to 640)"
path = "entities.player[0].y"
ram = [0xE2E6]
whole = true

[[field.case]]
unmeasured = "Out of a game (E3BD 1 in attract mode, 2 at game over) the slot holds the attract mode's objects"
when = "ram[0xE3BD] != 0"

[[field.case]]
unmeasured = "Between levels, at a level's start and in a life lost, the slot holds no bartender at a bar"
when = "!((ram[0xE2E6] >= 46 && ram[0xE2E6] <= 50) || (ram[0xE2E6] >= 94 && ram[0xE2E6] <= 98) || (ram[0xE2E6] >= 142 && ram[0xE2E6] <= 146) || (ram[0xE2E6] >= 190 && ram[0xE2E6] <= 194))"

# Where a run leaves what the template holds: scoring stops at the first
# frame out of scope. Set it once the level or stage byte is known, as:
# [scope]
# leaves = ["ram[0xE000]"]

[[field]]
note = "Not compared: the bartender's bar, E6F9 (0 the bottom bar, 3 the top), the tapper_bartender hook's word 0. It changes on the frame his y does (tapper-m3-five, frames 1116, 1136, 1153). Loaded so a clip's start knows his bar"
path = "entities.player[0].ext[0]"
presentation = true
ram = [0xE6F9]

[[field]]
note = "Not compared: bar 0's far end, the object at E366: its x, E369, written on the level setup's frame. The tip's place reads it ($2107 to $211D)"
path = "entities.tap[0].ext[0]"
presentation = true
ram = [0xE369]

[[field]]
note = "Not compared: the game's draw at its start, E3ED (0 or 1), which picks the list of the level's end scripts ($5623)"
path = "entities.tap[0].ext[1]"
presentation = true
ram = [0xE3ED]

[[field]]
note = "Not compared: bar 1's far end, the object at E36A: its x, E36D, written on the level setup's frame. The tip's place reads it ($2107 to $211D)"
path = "entities.tap[1].ext[0]"
presentation = true
ram = [0xE36D]

[[field]]
note = "Not compared: bar 2's far end, the object at E36E: its x, E371, written on the level setup's frame. The tip's place reads it ($2107 to $211D)"
