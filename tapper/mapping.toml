note = "A tip picked up starts the show ($0BD8 calls $14E7): eight draws, each 0 to 2 ($5FAC returns at most its A), that step through the customer slots ($1526 to $1538); a customer reached that isn't in state 1, 2 or 3 turns to watch (state 6, $1553). gp model static lists this call of $5FAC; --find didn't reach it in the 27,749-frame cycle, where no tip is picked up; tapper.tip.001 runs it (gp code listing). Named arrival_slot before, for a level's start, which it isn't"

