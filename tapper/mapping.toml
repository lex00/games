[[field]]
note = "Not compared: the presses the play routine reads, E38E: in a game $2B3A's read of the stick and the tap, in the attract demo the byte $59DD picks (bit 0 right, 1 left, 2 down, 3 up, 4 the tap). Loaded so a demo's first frames, before its first pick, press what the original's do"
path = "counters.demo_press"
presentation = true
ram = [0xE38E]

[[field]]
