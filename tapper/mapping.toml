note = "Not compared: the level number the HUD shows, less 1, read from its last cell (F6FA its code, $30 plus the digit, $5D9E; F6FB its high byte, $10): the screen draws it only with a stage ($5D8C) or the bonus round's card ($251F), so between a level's count ($5681) and the next stage the screen keeps the old number while E4A8 has the new one (tapper.clear.001 starts there: E4A8 1, the cell's code $31, its HUD 1; tapper.l8.001 $38 at level 8). Loaded so a clip's first frame draws the number its screen shows; -1 (no digit there, or a second digit before it) leaves it to the hooks, which give it the count on the first step"
path = "counters.cleared_shown"
presentation = true
ram = [0xF6FA]

[[field.case]]
