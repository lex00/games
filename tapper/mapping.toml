[[field]]
note = "Not compared: the bartender's bob, the hook's word 2: E727 (frames left to the next step, 2 to 0) plus 256 times E729 (the step, 0 to 3). Loaded so a start inside a walk bobs on the game's frame"
path = "entities.player[0].ext[2]"
presentation = true
ram = [0xE727, 0xE729]

[[field]]
lookup = [[0, 1]]
lookup_else = 0
note = "Not compared: the flow's word 0, 1 on the frame the level setup ($4B3F) has cleared the level's RAM: E6F2 is 0 then and on no other frame of a game (tapper-m3b-cycle: the frame before each of the bartender's 18 appearances, and the wait before the first level). The bartender appears on the next"
path = "entities.flow[0].ext[0]"
presentation = true
ram = [0xE6F2]

[[field.case]]
number = 0
when = "ram[0xE3BD] != 0"

[[field.case]]
note = "E6F2 is 0 too before a game's first setup has cleared it: in the boot (E397 0) and through the first level's intro ($5404, entered from the setup at $4B62 in a game). On the setup's own frame the game is in the setup's state (E397 8 for the first level, 9 or 11 for the next) and the objects from E18E, the bartender's at E2E6 among them, are empty: $5F31 clears them before the level's RAM ($4B4D, and $54DB at the intro's end)"
number = 0
when = "ram[0xE2E6] != 0 || (ram[0xE397] != 8 && ram[0xE397] != 9 && ram[0xE397] != 11)"

[[field]]
note = "Not compared: the level's layout, E3AF: bit k set puts bar k's tap on its left end. The setup reads it to draw the taps and to place the bartender ($4BF9). Above it the wait a script is in: $232B keeps the state it was called in at E3A8 and where it goes on at E3A9, and $5FE6 its registers from E39D (B at E39F), so a start inside $1CE1 knows its frame; then the lives, E4A7 ($1D71, $23AF)"
path = "entities.flow[0].ext[1]"
presentation = true
ram = [0xE3AF, 0xE3A8, 0xE3A9, 0xE3AA, 0xE39F, 0xE4A7]

[[field]]
note = "Not compared: the game's state E397 at a clip's start (the main loop's dispatch at $22B2: 10 in play, 8 starting the first level, 11 the next one), which says when a level's setup runs against the frame's timers, and 256 times the bar shown, E3B8, whose records the setup copies in; above them a life lost's step E6FF and its count E706 ($236E)"
path = "entities.flow[0].ext[3]"
presentation = true
ram = [0xE397, 0xE3B8, 0xE6FF, 0xE706]

[[field]]
digits = true
note = "Not compared until the model keeps it: The score: six digits a byte, E3F5 to E3FA, most significant first (the points routine $5EF3 adds into E3FA and carries up; player 2's would be 6 bytes on, by E3F2)"
path = "counters.score"
presentation = true
