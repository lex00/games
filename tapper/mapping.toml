lookup_else = 0
note = "Not compared: 1 while the bonus round's card is on the screen: E3B7 is 1 from $251C to $2530, and through the card's last frame the round is in or just out of its wait of 20 at $252C, E3A9 holding where it goes on ($252F; rbtapper's $2534), the stage's copy ($2546) only coming on the next frame (tapper.bonus.001 to .006 start there). Loaded so such a clip draws the card on its first frame; the hooks keep it from there"
path = "counters.bonus_card"
presentation = true
ram = [0xE3B7]

