# Two draws read the Z80's refresh register straight, not through $5FAC
# (docs/formats/draws.md, a site that reads a register).

[[draws]]
site = "end_twice"
pc = 0x467E
reg = "r"
note = "A level's end from the second level on (E4A8 not 0, $4678): ld a,r, and bit 0 at $4680; at 0 $4684 runs $4742 a second time, so the bartender's step away from the tap ($46B4) comes 53 frames later. On the frame $4742's last wait returns, 109 from the end's first"

[draws.at]
rbtapper = 0x4800

[[draws]]
site = "end_interlude"
pc = 0x48E7
reg = "r"
note = "End script 3 ($48D1) outside the space bar, when $2B58 finds no mug on the bartender's bar: ld a,r, and bit 0 at $48E9; at 1 the interlude is $51A9, at 0 $50EF (the space bar always runs $50EF). On the frame $58C5 returns, 172 from the end's first (53 more after a second $4742)"

[draws.at]
rbtapper = 0x4A69

# The mugs: 8-byte objects from E2FE (y, flags, picture, x, then a
# second sprite's), free while y is 0. gp track found them on tapper.l8.001
# (6 slots, stride 8, x E301); gp labels propose shows the send ($13CC)
# writing E2FE, E306 and E30E and the mugs' move ($0742) their x. Empty
# mugs and tips use the same slots and aren't modelled yet: they read as
# mugs that don't move.
[slots]
active = 0xE2FE
active_stride = 8
count = 9
note = "The mugs from E2FE, 8 bytes a slot (gp track, gp labels propose, gp element inputs). A slot holds an object while its y isn't 0. The slots hold the play's objects while the bars are set up: the setup's $4D13 writes the bars' far ends from E366 (bar 0's x at E369) with the taps, and $5F31 empties them with every object from E18E (the next setup at $4B4D, the bonus round's and the game over's), after which the slots hold the scripts' pictures (the setup's intro at $5404, the bonus round). So the play's objects stay through a customer's slide ($1CE1, the bartender off his bar), a life lost ($236E) and a level's end until the clear, as the program leaves them (tapper.l6.001, tapper.die.001). The rule before this one read them empty whenever the bartender was off a bar's line. The attract mode's instruction scene ($2EE0, called in the attract mode's state 6, E3BD 1, between its waits with E397 15 and 16) slides its mug in E2FE with no bars set up (E369 0), so in the attract mode the slots are compared whatever E369 holds: the model's mug there is a mug body (place_cast)"
vacant = "ram[0xE3BD] == 2 || (ram[0xE369] == 0 && ram[0xE3BD] != 1)"

