# lex00/tapper: written by gp game new. A commercial game: the package holds
# no game data, only facts about the romset and the model made from it.
[package]
name = "lex00/tapper"
version = "0.1.0"
kind = "game"
title = "Tapper"
tier = "commercial"

[rom]
how_to_get = """
A MAME romset of Tapper that you own: tapper.zip (scored, the regular art),
or rbtapper, tapperg, sutapper or tappera, each known by its chips' SHA-1s
whatever the files inside are named. Add it with `gp roms add`. The model is
regular Tapper's game; each set draws it with its own pictures, lifted by
region and index through the same asset map.
"""

# The romset's identity: the SHA-256 of its chips' SHA-1s, sorted
# (gp_arcade::romset). The asset map names pictures by region and
# index; lifted_sha256 is what it lifts from this set.
[[rom.entry]]
id = "tapper"
role = "scored"
title = "Tapper (Budweiser, 1/27/84)"
sha256 = "1da6316bba4785d780b3df3dc2a46753c09215cfa009f6f69dfd58cf753f4da9"
platform = "arcade"
system = "tapper"
board_status = "unverified"
asset_map = "assets/tapper.toml"
asset_map_sha256 = "919d7406893e284dcc3dad008c8a4e2a871a1d1657273131e1e4bf4542abe5d0"
