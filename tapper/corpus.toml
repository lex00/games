# The corpus plan (format 1.0.0): the recipes that make this game's clips.
# Written empty by gp game new. Each clip is presses from power-on and
# presses from there, as canonical `.presses` files in inputs/, with a
# frame count. Curves are never kept here: `gp game score` derives them
# from your own ROM.

