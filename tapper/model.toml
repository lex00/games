[evidence."entities.bars"]
source = "observed"
confidence = 60
note = "Read with gp code listing on tapper.l8.001 (the routines the clip ran, with each branch's ways): the play routine $0660 calls $06A4, $0B63, $0742, $0B43, $0890 in that order; the bar ends are the table at $0977, 4 bytes a bar, the left end at +1 and the right at +2 ($078B to $079D, $08B8 to $08D2), lifted from the player's romset (assets.bar_ends). A catch is the customer's x plus 8 less the mug's x below 25 ($0850) in states 0, 3, 4 or 5; pushed back 14 frames plus a draw of 0 to 20 ($09D3 to $09E2), at the full mug's speed plus 2 ($104D); 6 more turns of drinking ($1325); the empty mug 16 toward the tap and 3 above the line ($10F7), a wait of a draw of 0 to 15 plus 5 ($10C4); 14 frames after ($1134). New customers, tips, a mug falling and a customer reaching the bartender aren't modelled yet. A level ends when its last customer on the bars is served: $0963 takes one from E711 (one more at each arrival, $160F) and at 0 empties the timers ($5DEC) and sets state 11; the end's script ($55F4, then $4603 after levels 1 to 3) puts the bartender where he stands at his tap 56 frames on ($4742, $1351, the table at $C4A1) and steps him 1 away from the tap 53 frames after that ($46BF); tapper.l1.001 to l3.001 A customer's slide ($1CE1, gp code listing on tapper.l6.001's end): its waits keep where they go on (E3A9, B at E39F, $232B and $5FE6), so a start inside them takes its frame from there; where the slide ends $1F75 copies the four objects at $2003 into the mug slots from E326; $1F80 (4 frames), $1FBD (4) and ten waits of 4 ($1FE6) bring its return 48 frames after the copy, in state 12 with E6FF 3, and $2441 follows: with lives left $24C0 to $24D1 (state 9), with none ($244B) waits of 60 ($2467) and 60 ($24D8), $5E99 unless the sports bar, and state 13 ($24EE). The game over's objects stay two frames in state 13, then $230F's $2B82 empties them (observed on tapper.l6.001 and tapper.gameover.001, frames 9131 to 9133 and 3548 to 3550, not read in $2B82). Lives are the loaded E4A7 less those the model takes ($1D71, $23AF); an extra life ($615D) isn't modelled"

[[evidence."entities.bars".refs]]
at = "clip:tapper.l8.001"

[evidence."entities.bars.ext_params.catch_once"]
source = "observed"
confidence = 90
note = "The catch ($0B63) loads the bartender's y and x into D and E ($0B6D, $0B6E) and checks the mug slots from E2FE, then the tip at E25E. A catch of an empty mug calls the points routine with DE at $073C ($0BF2, $5EE7) and the loop goes on with D and E not his: no later mug or tip that frame is within 15 of y 7, x 60, so he catches one object a frame (gp trace instructions on tapper.l7.001 frame 11224: the slot at E30E caught, the one at E316 compared with DE $073C and caught on 11225). 1 is the original; the profile switch every_catch (normal) sets 0"

[[evidence."entities.bars.ext_params.catch_once".refs]]
at = "clip:tapper.l7.001"

[evidence."entities.bars.ext_params.setup_late_bars"]
source = "observed"
confidence = 90
note = "With the bar shown 2 or 3 (the punk bar: tapper.l6.001, l7.001, l8.001; the space bar: l10.001 to l13.001) the setup's timers count from the next frame, with 0 or 1 (l1 to l5, l14, l15) from the setup's own frame. The code says why: after the timers are set ($4C43) the setup calls $4937 ($4C4B), which by the bar shown (the table at $496E) returns at once for the saloon and the sports bar and runs a drawing routine for the punk bar and the space bar. Each of those starts with $5E99, which empties the list at E11A and then calls $60F6, the main loop's own frame wait (it spins until the interrupt sets E16C), so the rest of the setup and the main loop's next timer count ($60C1) come a frame later. A program wait, not a board quirk, so no switch"

[[evidence."entities.bars.ext_params.setup_late_bars".refs]]
at = "clip:tapper.l8.001"

[evidence."entities.customer"]
source = "observed"
confidence = 60
note = "gp code listing on tapper.l8.001: the customers' handlers, picked by state through $100A: waiting and then walking 12 frames, walking at E3B3 a frame, pushed back, drinking, and the two waits after the throw. gp code listing on tapper.tip.001 and tip.002: a tip picked up turns customers to watch the show ($14E7): eight draws at $1523, each 0 to 2 ($5FAC returns at most its A: $5FB1 to $5FB4 return on carry or zero), step through the slots from E262 and E4B2 ($1526 to $1538); a customer reached that isn't in state 1, 2 or 3 ($153A to $1547) takes state 6 and a timer of 255 ($154F, $1553), its picture from its record's +1B. State 6 ($11AA) stands, mirrored while bit 2 of the timer is 0, and at 0 waits again with its slot's wait ($11CA to $11EA). A mug passes one in state 6 ($0827 catches in states 0, 3, 4 and 5 only)"

[[evidence."entities.customer".refs]]
at = "clip:tapper.l8.001"

[evidence."entities.dancer"]
source = "observed"
confidence = 80
note = "gp code listing on tapper.tip.001 and tip.002 (gp code listing over the whole corpus finds E70F read only at $0C25): $14E7 sets E70F 1, E70E 6 and E712 255 ($14F1 to $14FD) and copies the bar shown's first picture over the 9 objects from E23E ($1500 to $1515). $0C25, the play routine's call after $0890, counts E712 down each frame; at 0 the show ends ($0C71 to $0C81: E70F 0, the objects' y 0); else E70E counts down and at 0 E710 steps 0 to 7 and the bar's next picture is copied ($0C38 to $0C68), E70E 6 again. On the pickup's frame both count once (gp query on tip.002's recording: E70E 5 and E712 254 on 15120, the next picture on 15125). $1CE1, $2389 and the level's end ($5604) empty the 9 objects; $1CE1 doesn't come back to the play routine ($232B jumps to $22A3), so its frame doesn't count. E70F, E710 and E712 stay through a life lost until the setup's clear of E6F2 to E733 ($4B65; tip.002: 0 on 15249, state 9). The last object is the tip's, E25E, so a tip left in the show is gone at the next picture, and every picture's copy ends a tip unless it holds $4D there. tip.002 runs from the pickup through a mug falling (15182) to the setup; the show's own end at 255 frames isn't in a clip"

