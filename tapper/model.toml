[evidence."entities.bars"]
source = "observed"
confidence = 60
note = "Read with gp code listing on tapper.l8.001 (the routines the clip ran, with each branch's ways): the play routine $0660 calls $06A4, $0B63, $0742, $0B43, $0890 in that order; the bar ends are the table at $0977, 4 bytes a bar, the left end at +1 and the right at +2 ($078B to $079D, $08B8 to $08D2), lifted from the player's romset (assets.bar_ends). A catch is the customer's x plus 8 less the mug's x below 25 ($0850) in states 0, 3, 4 or 5; pushed back 14 frames plus a draw of 0 to 20 ($09D3 to $09E2), at the full mug's speed plus 2 ($104D); 6 more turns of drinking ($1325); the empty mug 16 toward the tap and 3 above the line ($10F7), a wait of a draw of 0 to 15 plus 5 ($10C4); 14 frames after ($1134). New customers, tips, a mug falling and a customer reaching the bartender aren't modelled yet. A level ends when its last customer on the bars is served: $0963 takes one from E711 (one more at each arrival, $160F) and at 0 empties the timers ($5DEC) and sets state 11; the end's script ($55F4, then $4603 after levels 1 to 3) puts the bartender where he stands at his tap 56 frames on ($4742, $1351, the table at $C4A1) and steps him 1 away from the tap 53 frames after that ($46BF); tapper.l1.001 to l3.001. From the second level (E4A8 not 0, $4678) the Z80's refresh register is read at $467E on the frame $4742 returns and bit 0 at $4680 runs $4742 a second time at 0 ($4684), so the step and all after it come 53 frames later (the draw site end_twice, recorded by the arcade lockstep; tapper.l4.001, l5.001, l9.001, l12.001 to l15.001 take the second run). End script 3 ($48D1) outside the space bar runs $50EF when $2B58 finds a mug on the bartender's bar, else the refresh register again ($48E7, bit 0 at $48E9, the site end_interlude) picks $51A9 at 1: ten waits of 2 for the object at E356, the bartender 5 up and 5 along 2 frames on ($5220), where that object is plus 16 2 frames later ($5249), and from 4 frames after that ten hops 5 frames apart as in $50EF ($5263 to $52A3); tapper.l3.001 draws it, and tapper.clear.004 starts in its wait at $521D, its frame read from E3A9 and E39F as for the slide. Each end script is one step of the list at $563D (5 bytes: a call, then jr $5656): script 1 ($489A) returns 182 frames from the end's first ($4603, then $5904's 21 waits of 2 and $45E3's 12 of 1), script 3 after its interlude (242 after $50EF, 250 after $51A9); at $5656 the punk bar and the space bar wait a frame in $5E99, then E4A8 counts the level ($5681) and, when the count mod 13 ($5F6C) is 2, 5, 9, or 0 past the first, $2500 starts the bonus round and its $5F31 empties every object (gp code listing --writes E2E6 on tapper.l9.001, l13.001 and l15.001's last frames). Scripts 0, 2 and 4 aren't timed to their end. A customer's slide ($1CE1, gp code listing on tapper.l6.001's end): its waits keep where they go on (E3A9, B at E39F, $232B and $5FE6), so a start inside them takes its frame from there; where the slide ends $1F75 copies the four objects at $2003 into the mug slots from E326; $1F80 (4 frames), $1FBD (4) and ten waits of 4 ($1FE6) bring its return 48 frames after the copy, in state 12 with E6FF 3, and $2441 follows: with lives left $24C0 to $24D1 (state 9), with none ($244B) waits of 60 ($2467) and 60 ($24D8), $5E99 unless the sports bar, and state 13 ($24EE). The game over's objects stay two frames in state 13, then $230F's $2B82 empties them (observed on tapper.l6.001 and tapper.gameover.001, frames 9131 to 9133 and 3548 to 3550, not read in $2B82). Lives are the loaded E4A7 less those the model takes ($1D71, $23AF); an extra life ($615D) isn't modelled"

