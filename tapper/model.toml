x = 0
y = 192

[counters.cleared]
description = "Levels cleared, E4A8: 0 at a game's start, one more at each level's end ($5681), bonus rounds included"

[counters.lives]
description = "Lives, E4A7: 3 at a game's start ($4B22), one less when a life is lost ($23AF), one more at each extra-life score ($615D)"

[counters.mode]
description = "E3BD: 0 in a game, 1 in attract mode ($4AB8, $4E3D), 2 at game over"

[counters.score]
description = "The score, six decimal digits a byte at E3F5 to E3FA, most significant first; the points routine at $5EF3 adds from the last digit up, carrying. Nothing in the model scores yet"

[counters.shown]
description = "The bar shown, E3B8: 0 the saloon, 1 the sports bar, 2 the punk bar, 3 the space bar, set at each level's start from the levels cleared ($3C60 to $3C78)"

[present.screen]
size = [512, 480]

[evidence."entities.flow"]
source = "observed"
confidence = 80
note = "The level setup at $4B3F (read from the code with gp-arcade's write log): it clears E6F2 to E733, waits a frame, and at $4BCB puts the bartender at bar 2; E6F2 is 0 only on the setup's frame in tapper-m3b-cycle's games"

[[evidence."entities.flow".refs]]
at = "clip:tapper.l1.001"

[[evidence."entities.flow".refs]]
at = "clip:tapper.l3.001"

[evidence."entities.player"]
source = "observed"
confidence = 60
note = "The bartender's walk, bar moves and step back after a send, measured on the MAME oracle's captures tapper-m3-five and tapper-diagonal-4way-a (gp-arcade matches both on every frame); the bars' far ends and a left tap's place are guesses, and his walk's bob, his pictures, the mugs, customers and tips aren't modelled yet"

[[evidence."entities.player".refs]]
at = "clip:tapper.score.001"

[[evidence."entities.player".refs]]
at = "clip:tapper.l1.001"

[evidence."entities.player.ext_params.bob_frames"]
source = "observed"
confidence = 80
note = "His walk's bob moves him a pixel every 3 frames a direction is held: E727 counts 2, 1, 0 (gp model static: E727 set to 2 at $31E5 in $2EE0; tapper-diagonal-4way-a, frames 601 to 699)"

[[evidence."entities.player.ext_params.bob_frames".refs]]
at = "clip:tapper.l1.001"

