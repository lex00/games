[evidence."entities.player"]
source = "observed"
confidence = 60
note = "The bartender's walk, bar moves and step back after a send, measured on the MAME oracle's captures tapper-m3-five and tapper-diagonal-4way-a (gp-arcade matches both on every frame); the bars' far ends and a left tap's place are guesses, and his walk's bob, his pictures, the mugs, customers and tips aren't modelled yet"

