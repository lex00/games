[model]
schema = "0.4"
name = "tapper"
title = "Tapper"
description = "Tapper (tapper), a skeleton for the other genre written by gp game new. The system order is a placeholder until it's measured from the ROM's frame. The pad, the player and the empty level are placeholders too, so the model runs and its clips can be scored from the first one: their evidence says so, and each is replaced as it's measured"
source = "tapper"
view = "side"
frame_rate = "30"
systems = ["rules", "entity_states", "counters", "spawn", "platformer.player", "platformer.enemies", "platformer.contact", "exits", "camera"]

[model.extensions]
platformer = "0.4"

[input]
device = "arcade"

[input.actions]
button1 = "button1"
coin = "coin"
down = "down"
left = "left"
right = "right"
start1 = "start1"
up = "up"

[entities.player]
description = "The bartender, the game's object at E2E6 (y, flags, picture, x): walks along his bar, moves to the next bar's tap on up or down, pours at the tap and steps back when a mug is sent (tapper_bartender)"
ext = "tapper_bartender"
role = "player"
size = [16, 16]

[entities.player.ext_params]
far_left = 32
far_right = 232
pour_frames = 8
reach = 6
row_height = 48
row_top = 48
send_step = 6
stand_left = 16
stand_right = 16
switch_frames = 6
walk_step = 2

[entities.player.hitbox]
h = 16
w = 16
x = 0
y = 0

[entities.tap]
description = "A bar's tap, the game's objects at E346, E34A, E34E and E352 (one a bar, top first): its x and whether it is on the bar's left end (its flags' bit 4, the picture mirrored). Placed from the game's RAM when a clip starts; the bartender reads it"
no_slot = true
role = "npc"
size = [16, 16]

[entities.tap.hitbox]
h = 1
w = 1
x = 0
y = 0

[levels.main]
