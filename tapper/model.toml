[counters.attract_frames]
description = "The frames since the attract mode began (its logo, $3D76), 0 out of it; tapper_flow sets it each frame, and the attract's lines of text are drawn by it"

[counters.attract_screen]
description = "The attract mode's screen: 1 the logo's ($3D76), 2 the demo's ($4AAA) from attract_demo frames in, 0 out of the attract mode (E3BD not 1); tapper_flow sets it each frame from the attract's frames, and the looks pick the screen by it"

[counters.bonus]
description = "1 from the bonus round's start ($2500, called at $569D) to its end, which the hooks keep: no RAM byte marks the bonus round by itself"

[counters.cleared]
description = "Levels cleared, E4A8: 0 at a game's start, one more at each level's end ($5681), bonus rounds included"

[counters.coin_held]
description = "The coin switch as the coin routine last saw it settled, 1 while a coin is held: E097 0 ($0213 to $0229, read four times a frame by the CTC's interrupt at $0158; 1 from the boot, $0095)"

[counters.coins]
description = "Coins put in toward the next credit, E012 ($0242 to $0255): at the coins a credit (the defaults' E000) they become the credits a coin (E001)"

[counters.credits]
description = "Credits, E011: one more at each coin with the defaults' coinage ($024C to $0253), at most 9 ($0164), one less at a one-player start ($5860)"

[counters.lives]
description = "Lives, E4A7: 3 at a game's start ($4B22), one less when a life is lost ($23AF), one more at each extra-life score ($615D)"

[counters.mode]
description = "E3BD: 0 in a game, 1 in attract mode ($4AB8, $4E3D), 2 at game over"

[counters.score]
description = "The score, six decimal digits a byte at E3F5 to E3FA, most significant first; the points routine at $5EE7 adds an entry of the points rows from the last digit up, carrying (tapper_bars), only in a game (E3BD 0, $5EEB)"

[counters.score_2]
description = "Player 2's score, 0 in a one-player game: $05D5 draws it from E3EF at F06E"

[counters.screen]
description = "The stage's screen, 0 to 9: the place of the word $5DF6 takes for the stage (counter stage) among the words at $61ED, by address, as the screens are listed; tapper_bars sets it each frame from the lifted words. The looks pick the screen by it and the bar's colours ($570C) by the bar shown"

[counters.shown]
description = "The bar shown, E3B8: 0 the saloon, 1 the sports bar, 2 the punk bar, 3 the space bar, set at each level's start from the levels cleared ($3C60 to $3C78)"

[counters.stage]
description = "The stage the setup's $5DF6 shows, the place of its screen among the words at $61ED: the levels cleared, from 26 on 13 to 25 again ($5DFC to $5E0B), which tapper_bars keeps"

[present.screen]
size = [512, 480]

