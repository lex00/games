[model]
schema = "0.4"
name = "tapper"
title = "Tapper"
description = "Tapper (tapper), a skeleton for the other genre written by gp game new. The system order is a placeholder until it's measured from the ROM's frame. The pad, the player and the empty level are placeholders too, so the model runs and its clips can be scored from the first one: their evidence says so, and each is replaced as it's measured"
source = "tapper"
view = "side"
frame_rate = "30"
systems = ["rules", "entity_states", "counters", "spawn", "platformer.player", "platformer.enemies", "platformer.contact", "exits", "camera"]

[model.extensions]
platformer = "0.4"

[input]
device = "arcade"

[input.actions]
button1 = "button1"
coin = "coin"
down = "down"
left = "left"
right = "right"
start1 = "start1"
up = "up"

[entities.flow]
description = "The game's flow between plays, a body with no box: a level's start ($4B3F), which puts the taps by the level's layout and the bartender at bar 2 on the frame after the setup clears the level's RAM (tapper_flow)"
ext = "tapper_flow"
no_slot = true
role = "npc"
size = [1, 1]

[entities.flow.ext_params]
start_bar = 2
start_left = 61
start_right = 171
tap_left = 13
tap_right = 225
tap_step = 16

[entities.flow.hitbox]
h = 1
w = 1
x = 0
y = 0

[entities.player]
description = "The bartender, the game's object at E2E6 (y, flags, picture, x): walks along his bar, moves to the next bar's tap on up or down, pours at the tap and steps back when a mug is sent (tapper_bartender)"
ext = "tapper_bartender"
role = "player"
size = [16, 16]

[entities.player.ext_params]
bob_frames = 3
far_left = 32
far_right = 232
four_way = 1
pour_frames = 5
reach = 6
row_bottom = 48
row_height = 48
send_step = 6
stand_left = 16
stand_right = 16
switch_busy = 7
switch_frames = 6
walk_step = 2

[entities.player.hitbox]
h = 16
w = 16
x = 0
y = 0

[entities.tap]
description = "A bar's tap, the game's objects at E346, E34A, E34E and E352 (one a bar, bottom first): its x and whether it is on the bar's left end (its flags' bit 4, the picture mirrored). Placed from the game's RAM when a clip starts; the bartender reads it"
no_slot = true
role = "npc"
size = [16, 16]

[entities.tap.hitbox]
h = 1
w = 1
x = 0
y = 0

[levels.main]
description = "The first level, not lifted yet: no tiles"
empty = true
size = [32, 30]
tile_size = 16

[[levels.main.spawn]]
entity = "flow"
x = 0
y = 0

[[levels.main.spawn]]
entity = "player"
x = 0
y = 0

[[levels.main.spawn]]
entity = "tap"
x = 0
y = 48

[[levels.main.spawn]]
