[evidence."entities.player.ext_params.pour_frames"]
source = "observed"
confidence = 90
note = "5 frames held fill a mug: gp model static reads E715 set to 4 at $121F, and gp model blind's hold_frames is 5. gp model blind's pour_frames (12) and gp rule lane's (8) are the fewest frames held before a send they saw; the clips decide: with every counter left out of the mapping, 5 (or 2, rule lane's pour_least) scores 87.7% on the 52 clips, 8 86.6% and 12 85.6%"

[[evidence."entities.player.ext_params.pour_frames".refs]]
at = "rom:1da6316bba47 frames 321-645: gp model blind, the frames the held button counts before it acts"

