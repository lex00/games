[counters.attract_frames]
description = "The frames since the attract mode began (its logo, $3D76), 0 out of it; tapper_flow sets it each frame, and the attract's lines of text are drawn by it"

[counters.attract_screen]
description = "The attract mode's screen: 1 the logo's ($3D76), 2 the demo's ($4AAA) from attract_demo frames in, 3 the high scores after its demo game ($4A37), 0 out of the attract mode (E3BD not 1); tapper_flow sets it each frame from the attract's frames, and the looks pick the screen by it"

[counters.bonus]
description = "1 from the bonus round's start ($2500, called at $569D) to its end, which the hooks keep: no RAM byte marks the bonus round by itself"

[counters.bonus_card]
description = "1 while the bonus round shows its card ($251F: E395 = $B4A1, E3B7 1, which keeps the HUD's score and lives off) before its stage ($2546), the round's frames before 23; tapper_bars sets it from the round's frame count"

[counters.bonus_shaken]
description = "Loaded at a clip's start only: the bonus round's six marks of a can shaken (+5 of each can's object, E267 to E28F 8 apart, which $264F sets to 1 after the can's shake), a byte each from the lowest. Those objects stand at y 0, so no bonus_object body carries them; a start inside the round's shakes, walk off or blink reads them (bonus_resume). The hooks never change it"

[counters.bonus_text]
description = "The bonus round's line of text: 1 its first ($253D), 2 the four after the shuffle ($26BF), 3 the win's two, 4 the win's first alone as the second blinks ($2830), 5 the loss's ($28F2), 0 none; tapper_bars sets it each frame"

[counters.bonus_tint]
description = "1 on the bonus round's frame 1 alone: $251F has written the card's palette (bonus_colors over the board's) but the screen's lines are the last level's until the next frame's copy, so its stage and HUD show in the card's colours; tapper_bars sets it from the round's frame count"

[counters.boot_bars]
description = "30 while the screen still shows the self-test's colour bars ($C64A in the boot), the rows of them drawn; 0 from the logo's first screen on. tapper_flow clears it on the logo's second frame, when the vblank's $5CED has copied the logo's screen ($3D76 sets E395 on the frame before)"
start = 30

[counters.cleared]
description = "Levels cleared, E4A8: 0 at a game's start, one more at each level's end ($5681), bonus rounds included"

[counters.cleared_shown]
description = "The levels cleared as the HUD's level number shows them: E4A8 as the copy of a stage's screen ($5CED) last drew it, with the lives (counter lives_shown), so a level's clear, which counts E4A8 at once, shows the old number until the next stage (tapper.l1.001's last frame); -1 until the hooks first set it, when the HUD shows E4A8"
start = -1

[counters.coin_held]
description = "The coin switch as the coin routine last saw it settled, 1 while a coin is held: E097 0 ($0213 to $0229, read four times a frame by the CTC's interrupt at $0158; 1 from the boot, $0095)"

[counters.coins]
description = "Coins put in toward the next credit, E012 ($0242 to $0255): at the coins a credit (the defaults' E000) they become the credits a coin (E001)"

[counters.credits]
description = "Credits, E011: one more at each coin with the defaults' coinage ($024C to $0253), at most 9 ($0164), one less at a one-player start ($5860)"

[counters.credits_shown]
description = "The credits as the credit line shows them: E011 as the last frame ended, set by tapper_flow before the frame's coin, since the coin routine counts in the CTC's interrupt and the main loop redraws the line ($03EA) on the next frame (tapper.attract.001: counted on 762, drawn on 763)"

[counters.cycle_index]
description = "The next step of the cycles' lists, as their pointer (E11F) stands from their start (E11D), 3 bytes a step"

[counters.cycle_list]
description = "The cycles running: 2 the punk bar's lamps, 3 the space bar's three lights, as the setup's $4937 chose them by the bar shown; 0 none"

[counters.cycle_on]
description = "1 while the frame's palette cycles run ($01CC, E410): set by $5EA9 as a punk or space bar's setup adds them ($4937), 0 after $5E99 empties them (a life lost outside the sports bar, $24C0; the game over, $24E2)"

[counters.cycle_start]
description = "The low byte of the cycles' list start (E11D) as a clip's start loads it, so the hooks can count the pointer's step from it; 0 once counted"

[counters.cycle_step]
description = "The step of the cycles last written, plus 1 (the looks write its colours); 0 before the first, and from the frame after a $5E99 empties them"

[counters.cycle_wait]
description = "The frames to the cycles' next step, E121 ($01E1 counts it down; at below 0 the step's colour is written and the step's frames begin)"

[counters.dancers_on]
description = "1 while the dancers of the show a tip starts are up: from the pickup's first picture over the 9 objects from E23E ($150F) until they go at the show's end ($0C75) or when a level's end, a slide, a life lost or a setup empties the objects; tapper_bars sets it each frame, so a theme can show what the room does while they dance (#+ room_react_when)"

[counters.demo]
description = "1 while the attract mode plays its demo game (E3BD 1): from $5A64, state 2, through its play (state 3), its life lost (12) and the high scores after it ($4A37, state 4) to state 0, whose $22B8 starts the logo again"

[counters.demo_count]
description = "E3C4: the frames to the demo's next pick, 6 from $5A64 and 16 from each pick ($59EE)"

[counters.demo_place]
description = "E3C3: the place of the demo's next press in the list it picks ($5A01 to $5A1A); at 15 the pick sets it to 0 and leaves the presses as they were. Kept from one demo to the next"

[counters.demo_press]
description = "E38E: the presses the play routine reads, bit 0 right, 1 left, 2 down, 3 up and 4 the tap ($06FE): in a game the stick and the tap as $2B3A reads them, in the demo the byte $59DD picks"

[counters.extra_every]
description = "The extra life's every, as the instruction scene's close draws it ($3378 to $338E): E00F and E010, the defaults' 16th and 17th bytes that the boot copies ($0517), as two digits; tapper_bars sets it in the attract mode"

[counters.extra_first]
description = "The first extra life's score, as the instruction scene's close draws it ($3360 to $3376): E00D and E00E, the defaults' 14th and 15th bytes that the boot copies ($0517), as two digits; tapper_bars sets it in the attract mode"

[counters.game_over_asked]
description = "Loaded at a clip's start only: the sound queue as the frame ended (E114, E0E1, E0E2), 0x030202 once the game over's $49E5 has asked for its sounds 2 and 3. A start in state 13 with E3BD 0 reads it to tell the game over's first frame (the queue empty, the objects up, sub 1) from its second (asked, sub 2 with its count at 0). The hooks never change it"

[counters.game_over_text]
description = "1 while GAME OVER is on the bottom bar: from the frame $2441 queues it with no lives left ($244B) through its two waits of 60 ($2467, $24D8) to the game over's first frame (state 13), whose $2B82 clears the screen on the next; 0 otherwise. tapper_bars sets it each frame from the flow's state"

[counters.initials]
description = "The game over's initials ($2B82, state 13 and E3BD 2): 0 out of them; 1 from the frame $3CE1 clears the screen and draws the table's new entry (with $2B82's palette writes to F860 and F86D), 2 once the interrupt has written the three strings $2C87 to $2C99 queue and the letter's colour is set ($2CDD), 3 once the cheerleader's objects ($2CBD, $2B0C) are in sprite RAM; back to 0 as the game over ends (state 0, $4A27, 1203 frames on: the initials' timer of $4B0 at $2CA7). tapper_bars sets it each frame from the flow's count"

[counters.initials_at]
description = "The place of the new entry's letters being entered in the initials: 0 to 2, 3 once the third is entered ($2D30). tapper_bars' initials_entry sets it"

[counters.initials_end]
description = "The flow's count the game over ends at when the third letter is entered: the frame's count plus 31 ($2D6D waits 30 frames, then state 0 as after the timer); 0 while it hasn't been, and the 1200-frame timer ends it (tapper.gameover.003: entered on count 285, state 0 on 315's frame)"

[counters.initials_letter]
description = "The new entry's first letter in the initials: 0 out of them, 1 to 26 A to Z, 27 blank. A from $2C54; up steps it on ($2CFC, Z to blank to A), down back ($2D0E), each then waiting 10 frames"

[counters.initials_letter_2]
description = "The new entry's second letter, as initials_letter: 0 until the first is entered, then A ($2D37)"

[counters.initials_letter_3]
description = "The new entry's third letter, as initials_letter: 0 until the second is entered, then A ($2D37)"

[counters.initials_next]
description = "The flow's count the initials next read the stick and the tapper on ($2B3A): the next frame, or 10 on after a letter steps ($2D51)"

[counters.initials_place]
description = "The new entry's place in the high scores' table less 1 ($2C34): the places whose scores it isn't under ($5C8A's compare from the tenth up, a tie going above), 0 the first. tapper_bars sets it as it takes the entry into the table"

[counters.initials_tap]
description = "1 while the initials wait for the tapper's release ($2D20), the letter entered on the frame it is let go"

[counters.intro]
description = "The level's intro ($5404), counted by tapper_bars from the setup: 1 on the setup's frame (2 in a game's first level and after a life lost, whose screen is cleared on the setup's frame), then the frames since plus 1 while the screen is cleared and its lines are up, one past its count on the frame the screen keeps it after the stage is drawn ($5DF6, counter stage_late), then 0"

[counters.level_end]
description = "1 while a level's end script runs: from the frame $55F4 starts it (the last customer gone, the level's points) through its waits to its return, where $5681 counts the level (counter cleared) and the setup or the bonus round comes next; 0 otherwise. Presentation only, for a theme's room: tapper_bars sets it each frame from the flow's state"

[counters.life_lost]
description = "1 from the frame a life is lost to the next life's setup: a mug off a bar's end (state 12, $236E, the life taken at $23AF) through its fall and crash, or a customer at the bartender's end through his slide ($1CE1, the life taken at $1D71) and the state 12 it goes on in, then state 9 until the setup ($4B5B) clears the screen for the next life's intro; with no lives left it ends as GAME OVER goes up (counter game_over_text). 0 otherwise. Presentation only, for a theme's room: tapper_bars sets it each frame from the flow's state"

[counters.lives]
description = "Lives, E4A7: 3 at a game's start ($4B22), one less when a life is lost ($23AF), one more at each extra-life score ($615D)"

[counters.lives_given]
description = "The extra lives given, E3F3: $6143 gives one more each time the score in thousands passes the first setting (E05C) and then each step of the second (E05D) beyond it, after each frame's points ($05D1); 0 again when the score rolls over ($5F23)"

[counters.lives_shown]
description = "The lives the HUD shows: E4A7 as the copy of a screen ($5CED) last drew them ($5D21, one fewer mug for player 1), at a level's setup ($4B6E's $5DF6) and the tip show's end ($0C95), so a life lost shows only from the next setup; -1 until the hooks first set it"
start = -1

[counters.mode]
description = "E3BD: 0 in a game, 1 in attract mode ($4AB8, $4E3D), 2 at game over"

[counters.mode_shown]
description = "The mode as the screen shows it, which the board reads: E3BD, except on the frame a start is taken in the attract mode ($584F, $4AEF), when the attract's screen is still up (1) and $4B3F empties it on the next (tapper_flow)"

[counters.score]
description = "The score, six decimal digits a byte at E3F5 to E3FA, most significant first; the points routine at $5EE7 adds an entry of the points rows from the last digit up, carrying (tapper_bars), only in a game (E3BD 0, $5EEB)"

[counters.score_2]
description = "Player 2's score, 0 in a one-player game: $05D5 draws it from E3EF at F06E"

[counters.screen]
description = "The stage's screen, 0 to 9: the place of the word $5DF6 takes for the stage (counter stage) among the words at $61ED, by address, as the screens are listed; tapper_bars sets it each frame from the lifted words. The looks pick the screen by it and the bar's colours ($570C) by the bar shown"

[counters.shown]
description = "The bar shown, E3B8: 0 the saloon, 1 the sports bar, 2 the punk bar, 3 the space bar, set at each level's start from the levels cleared ($3C60 to $3C78)"

[counters.space_pad]
description = "The space bar's lit pad: 0 none, else 1 to 8, the place in the table at $1980 that $1921 lights: the bartender's bar E6F9 from 1, 4 more when that bar's tap is on its left; tapper_bartender sets it each frame"

[counters.space_wait]
description = "Frames left of the space bar's wait: its stage is up 30 frames ($575B's $232B with $1E, called at the setup's $4B8B) before $600F and $570C load its colours and $4C60 lights the pad; tapper_bars counts it down from the stage's draw, 0 otherwise"

[counters.space_wait_step]
description = "The step, 0 to 2, of the four colour runs the space bar's setup starts ($575B's $5EA9 calls): 3 frames a step, round again while the wait (counter space_wait) lasts; tapper_bars sets it"

[counters.stage]
description = "The stage the setup's $5DF6 shows, the place of its screen among the words at $61ED: the levels cleared, from 26 on 13 to 25 again ($5DFC to $5E0B), which tapper_bars keeps"

[counters.stage_late]
description = "1 on the frame the level's intro ends and the stage is drawn ($5DF6): the screen still shows the intro then and the stage from the next frame, where tapper_bars sets it and the counter intro back to 0 (tapper.l1.001 and l5.001 start on that frame: GET READY on their first frame, the stage on their second)"

