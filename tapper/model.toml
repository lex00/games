[evidence."entities.player.ext_params.four_way"]
source = "observed"
confidence = 90
note = "The cabinet's stick moves four ways (MAME's PORT_4WAY filter, held to MAME with tapper-diagonal-4way-a): the profile switch any_way_stick turns it off, so the board sees two directions at once and takes them in its own order ($06FE: right, left, down, up)"

[[evidence."entities.player.ext_params.four_way".refs]]
