# Each arcade source lists its set's chips as [[source.chip]] rows: the
# file name, the MAME region it loads into, the offset there, the size and
# the SHA-1. The tools read these to know a romset zip by its chips
# (gp_arcade::romset; docs/sources.md, "Arcade chips"). The lists come from
# MAME 0.276's src/mame/midway/mcr.cpp, ROM_START( tapper ), rbtapper,
# tapperg, sutapper and tappera: license:BSD-3-Clause,
# copyright-holders:Aaron Giles.
