# The theme kit for tapper (docs/theme-kit.md), written by `gp theme kit` from
# the model. It names no character and holds no art: describe and draw
# each slot from its role and description, and replace each sound role
# with an original sound. .claude/skills/theme-generation/SKILL.md says how.
format = "0.1.0"
game = "tapper"
model = "tapper"
screen = [512, 480]
