# Prompt words for tapper's theme kit (docs/theme-kit.md, "Prompt words"),
# written by hand from the game's screens and the contact sheets of
# `gp theme look sheet` (each code looked at on the sheet). A board sprite's
# poses go by its picture code in [art.frames]. `deny` lists the words no
# prompt-facing text may hold; `note` keeps the game's own term for people and
# never reaches the kit. Scenery and objects are written first; the
# characters' poses by code come last, as the theme draws them.
format = "0.1.0"
deny = ["tapper", "bally", "midway", "budweiser", "bud", "root beer", "rootbeer", "beer", "anheuser", "busch", "saloon", "cowboy", "punk", "bandit", "sports bar", "space bar", "keg", "bartender", "barman", "mustache", "moustache", "bow tie", "suspenders", "stetson", "cowboy hat"]

# The rooms. Each holds four long serving counters, one above another, seen
# from a raised three-quarter view: each runs from a door at the far side
# toward the server's end, where a drink dispenser stands. Guests come in at
# the doors and walk along the counters. The counters stay where the game has
# them; a theme builds each room from its own pieces on them.

[[art]]
id = "screen.screen_saloon"
label = "first room, frontier tavern"
description = "the first room: a frontier tavern with plank walls in deep blue, four long wooden serving counters with dark wood fronts, swinging doors at each counter's far end, a framed picture on the left wall, a sign over the back wall, and round wooden barrel ends set into the right wall where the drinks are drawn; 512 by 480 pixels"
note = "the saloon (levels 1 to 3)"

[[art]]
id = "screen.screen_9e21"
label = "first room, frontier tavern, second look"
description = "the frontier tavern again, as it returns after the fourth room: plank walls in deep blue, four wooden serving counters, swinging doors, a framed picture and a sign, and a small figure hanging on the right wall; 512 by 480 pixels"
note = "the saloon as it comes back (level 14)"

[[art]]
