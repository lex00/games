# What the ROM-blocking hook guards (scripts/romguard/rom_text.py), by hash
# only: never the games themselves. Each hash is checked against the
# person's own files in $GP_ROM_DIR.
#
# [[source]]: a NES image by the SHA-256 of its PRG and CHR data, the iNES
# header (and any trainer) removed, as `gp roms scan` prints it. Every
# source the old tool's sources/nes.toml listed is here, so a game it
# registered stays guarded before its package comes over. Each id is
# `sha256-` and the hash's first 12 digits: this file names no game. The
# hook also reads roms/*.toml, */roms.toml, the games checkout's
# */roms.toml and every package.toml's [[rom.entry]].
#
# An arcade set's chips are guarded from the game's roms.toml, whose
# arcade sources list them as [[source.chip]] rows (docs/sources.md,
# "Arcade chips"). [[chip]] here is a board's own chip, which no set's
# list names: the SSIO board's PROM (gp_arcade::romset::SSIO_PROM), by
# the SHA-1 MAME lists it by. The games repo keeps the same file.

