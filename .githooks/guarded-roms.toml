# What the ROM-blocking hook guards (scripts/romguard/rom_text.py), by hash
# only: never the games themselves. Each hash is checked against the
# person's own files in $GP_ROM_DIR.
#
# [[source]]: a NES image by the SHA-256 of its PRG and CHR data, the iNES
# header (and any trainer) removed, as `gp roms scan` prints it. Every
# source the old tool's sources/nes.toml listed is here, so a game it
# registered stays guarded before its package comes over. The hook also
# reads roms/*.toml, */roms.toml and every package.toml's [[rom.entry]].
#
# [[chip]]: one chip of an arcade romset, by the SHA-1 MAME lists it by,
# with where it loads, copied from gp-arcade's set table
# (crates/gp-arcade/src/romset.rs, SETS and SSIO_PROM). A test in
# crates/gp-arcade/tests/guarded_chips.rs fails when the two differ. The
# games repo keeps the same file.

